name: Build TwinPing Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21 for Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies & Build Bundle
        run: |
          npm install
          npm run build
          npx --yes @capacitor/cli@latest init "TwinPing NOC" "com.twinping.noc.tablet" --web-dir dist || true
          npm install @capacitor/core @capacitor/android
          npx cap add android || true
          npx cap sync android

      - name: Compile Standalone Android APK (Gradle AssembleDebug)
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Ready-to-Install APK File
        uses: actions/upload-artifact@v4
        with:
          name: TwinPing-NOC-Android-Tablet-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
